<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - E-Wallet</title>
    <link rel="stylesheet" href="style/style.css"> 
    <style>
        /* Estilos simples para centralizar */
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: #f9fafb; }
        .form-container { background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); width: 90%; max-width: 400px; }
        .form-container h2 { text-align: center; margin-bottom: 20px; }
        .form-container form div { margin-bottom: 15px; }
        .form-container label { display: block; margin-bottom: 5px; font-weight: 500; }
        .form-container input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        .form-container button { width: 100%; padding: 12px; border: none; border-radius: 20px; background-color: #2500f9; color: #fff; font-weight: bold; cursor: pointer; }
        .form-container p { text-align: center; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Criar Conta</h2>
        <form id="register-form">
            <div>
                <label for="username">Usuário (E-mail)</label>
                <input type="email" id="username" required>
            </div>
            <div>
                <label for="password">Senha</label>
                <input type="password" id="password" required>
            </div>
            <div>
                <label for="cpf">Digite o CPF</label>
                <input type="text" id="cpf" placeholder="123.456.789-00" required>
            </div>
            <div>
                <label for="dinheiro_na_conta">Depósito Inicial (R$)</label>
                <input type="number" id="dinheiro_na_conta" min="0" step="0.01" placeholder="0.00" required>
            </div>
            <button type="submit">Cadastrar</button>
        </form>
        <p>Já tem uma conta? <a href="login.html">Faça login</a></p>
    </div>

    <script>
        document.getElementById('register-form').addEventListener('submit', function(event) {
            event.preventDefault(); 

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const cpf = document.getElementById('cpf').value;
            const initialDeposit = parseFloat(document.getElementById('dinheiro_na_conta').value);

            // Chave única para cada usuário (baseada no email)
            const dataKey = 'eWalletData_' + username;
            
            // 1. Verifica se o usuário já existe
            if (localStorage.getItem(dataKey)) {
                alert('Este e-mail já está cadastrado.');
                return;
            }

            // 2. Cria a "Conta Principal"
            const initialAccountId = Date.now();
            const initialAccount = {
                id: initialAccountId,
                name: "Conta Principal"
            };

            // 3. Cria a primeira transação (o depósito inicial)
            const initialTransaction = {
                id: Date.now() + 1,
                accountId: initialAccountId,
                type: "credit",
                date: new Date().toISOString().split('T')[0], // Data de hoje
                details: "Depósito Inicial",
                amount: initialDeposit
            };

            // 4. Cria o objeto de dados COMPLETO do usuário
            const userData = {
                login: {
                    username: username,
                    password: password, 
                    cpf: cpf
                },
                accounts: [ initialAccount ], // Adiciona a conta principal
                transactions: [ initialTransaction ] // Adiciona a transação inicial
            };

            // 5. Salva tudo em uma única chave no localStorage
            localStorage.setItem(dataKey, JSON.stringify(userData));

            alert('Cadastro realizado com sucesso! Você será redirecionado para o login.');
            
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
