<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - E-Wallet</title>
    <link rel="stylesheet" href="style/style.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: #f9fafb; }
        .form-container { background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); width: 90%; max-width: 350px; }
        .form-container h2 { text-align: center; margin-bottom: 20px; }
        .form-container form div { margin-bottom: 15px; }
        .form-container label { display: block; margin-bottom: 5px; font-weight: 500; }
        .form-container input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        .form-container button { width: 100%; padding: 12px; border: none; border-radius: 20px; background-color: #2500f9; color: #fff; font-weight: bold; cursor: pointer; }
        .form-container p { text-align: center; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Entrar na E-Wallet</h2>
        <form id="login-form">
            <div>
                <label for="username">Usuário (E-mail)</label>
                <input type="email" id="username" required>
            </div>
            <div>
                <label for="password">Senha</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit">Entrar</button> 
        </form>
        <p>Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', function(event) {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // 1. Procura pela chave de dados única
            const dataKey = 'eWalletData_' + username;
            const dataString = localStorage.getItem(dataKey);
            
            if (!dataString) {
                alert('Usuário não encontrado. Por favor, cadastre-se.');
                return;
            }

            // 2. Converte os dados do usuário
            const userData = JSON.parse(dataString);

            // 3. Verifica se a senha dentro do objeto bate
            if (password === userData.login.password) {
                
                // SUCESSO!
                sessionStorage.setItem('isLoggedIn', 'true');
                sessionStorage.setItem('loggedInUser', username); // Salva o email para o dashboard usar
                
                // Redireciona para a página protegida
                window.location.href = 'dashboard.html';

            } else {
                // FALHA!
                alert('Senha incorreta.');
            }
        });
    </script>
</body>
</html>
